<marker id="io" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#277565"/></marker>
</defs><rect width="1540" height="1320" fill="#fff"/>
<text x="34" y="48" class="head" text-anchor="start">Agent Runtime</text>
<text x="35" y="77" class="sub" text-anchor="start">КТ2  /  трек A  /  реализация 50ed303  /  20 ноября 2026</text>
<rect x="32" y="104" width="334" height="591" rx="12" class="area"/>
<rect x="388" y="104" width="799" height="591" rx="12" class="area"/>
<rect x="1208" y="104" width="300" height="591" rx="12" class="area"/>
<text x="51" y="140" class="section" text-anchor="start">Mac · машина пользователя</text>
<text x="410" y="140" class="section" text-anchor="start">Debian · Linux-хост</text>
<text x="1230" y="140" class="section" text-anchor="start">Внешняя сеть</text>
<rect x="412" y="169" width="752" height="123" rx="12" class="group"/>
<text x="430" y="194" class="label" text-anchor="start">Контейнер gateway</text>
<path d="M342 236 H431" class="edge" marker-end="url(#edge)"/>
<path d="M431 258 H342" class="edge" marker-end="url(#edge)"/>
<rect x="53" y="202" width="289" height="76" rx="8" class="node"/>
<text x="66" y="228" class="nodeTitle" text-anchor="start">CLI</text>
<text x="66" y="249" class="detail" text-anchor="start">HTTP-токен · session · message_id</text>
<text x="66" y="267" class="detail" text-anchor="start">команды и ответ в терминале</text>
<rect x="431" y="203" width="287" height="75" rx="8" class="node"/>
<text x="444" y="229" class="nodeTitle" text-anchor="start">Gateway / Workspace</text>
<text x="444" y="250" class="detail" text-anchor="start">проверка bearer · результаты в RAM</text>
<text x="444" y="268" class="detail" text-anchor="start">состояние сообщения по ID</text>
<path d="M718 235 H819" class="edge" marker-end="url(#edge)"/>
<path d="M819 257 H718" class="edge" marker-end="url(#edge)"/>
