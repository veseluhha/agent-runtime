<svg xmlns="http://www.w3.org/2000/svg" width="1540" height="1320" viewBox="0 0 1540 1320" role="img" aria-labelledby="title desc">
<title id="title">Agent Runtime -- архитектура на срезе 50ed303</title>
<desc id="desc">Диаграмма трека A. Верхняя часть показывает Mac, Linux-хост, компоненты в контейнерах, внешний провайдер и каналы данных. Ниже показаны жизненный цикл сообщения, восстановление и сохранение трейсов БАФ.</desc>
<defs>
