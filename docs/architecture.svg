text { font-family: Inter, Arial, sans-serif; fill: #192f43 }
.head { font-size: 34px; font-weight: 700 } .section { font-size: 22px; font-weight: 700 }
.sub { font-size: 17px; fill: #445b69 } .nodeTitle { font-size: 19px; font-weight: 700 }
.detail { font-size: 15px } .label { font-size: 13px; font-weight: 600; fill: #345578 }
.dataLabel { font-size: 13px; font-weight: 600; fill: #17645b }
.area { fill: #f5f8fb; stroke: #a9bbc8; stroke-width: 1.6 }
.group { fill: #e8eff8; stroke: #92abc8; stroke-width: 1.3 }
.node { fill: white; stroke: #8099b0; stroke-width: 1.5 }
.data { fill: #edf8f4; stroke: #6a9b8e; stroke-width: 1.6 }
.external { fill: #fff8ea; stroke: #bd9955; stroke-width: 1.5 }
.edge,.io { fill: none; stroke-width: 2; stroke-linejoin: round }
.edge { stroke: #42658a } .io { stroke: #277565 }
.rule { fill: #d3dce3; stroke: none }
