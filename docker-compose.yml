services:
  sandbox-image:
    image: python:3.12.10-alpine3.21
    command: ["true"]
    network_mode: none
  sandbox-manager:
    build: {context: ., target: manager}
    environment:
      INSTANCE: ${COMPOSE_PROJECT_NAME}
    volumes: [/var/run/docker.sock:/var/run/docker.sock]
    networks: [backend]
    depends_on:
      sandbox-image: {condition: service_completed_successfully}
    healthcheck: &health
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 10
  llm-proxy:
    build: {context: ., target: app}
    command: ["python", "-m", "runtime.proxy"]
    user: "65534:65534"
    networks: [backend]
    healthcheck: *health
  gateway:
    build: {context: ., target: gateway}
    environment:
      CLIENT_TOKEN: ${CLIENT_TOKEN:?set CLIENT_TOKEN in .env}
    networks: [frontend, backend]
    ports: ["127.0.0.1:${GATEWAY_PORT:-8080}:8080"]
    depends_on:
      sandbox-manager: {condition: service_healthy}
      llm-proxy: {condition: service_healthy}
    healthcheck: *health
networks:
  frontend: {}
  backend: {internal: true}
