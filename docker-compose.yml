services:
  sandbox-image:
    image: python:3.12.10-alpine3.21
    command: ["true"]
    network_mode: none
  sandbox-manager:
    build: {context: ., target: manager}
    environment:
      INSTANCE: ${COMPOSE_PROJECT_NAME}
    volumes: [/var/run/docker.sock:/var/run/docker.sock]
    networks: [backend]
    depends_on:
      sandbox-image: {condition: service_completed_successfully}
    healthcheck: &health
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 10
  model-proxy:
    build: {context: ., target: app}
    command: ["python", "-m", "runtime.model_proxy"]
    user: "65534:65534"
    networks: [backend, provider]
    environment:
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
    healthcheck: *health
  baf-runner:
    profiles: [experiment]
    build: {context: ., target: gateway}
    networks: [backend]
    volumes: [./results/baf:/results]
    entrypoint: ["python", "-m", "runtime.experiment"]
  gateway:
    build: {context: ., target: gateway}
    user: "${LOCAL_UID:-65534}:${LOCAL_GID:-65534}"
    volumes: [./results/baf:/results]
    environment:
      CLIENT_TOKEN: ${CLIENT_TOKEN:?set CLIENT_TOKEN in .env}
    networks: [frontend, backend]
    ports: ["127.0.0.1:${GATEWAY_PORT:-8080}:8080"]
    depends_on:
      sandbox-manager: {condition: service_healthy}
      model-proxy: {condition: service_healthy}
    healthcheck: *health
networks:
  provider: {}
  frontend: {}
  backend: {internal: true}
